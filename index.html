<body>

  <div class="app-container">
    
    <!-- Cast / Story Bible -->
    <div>
      <div class="section-title">Story Bible • Scene Cast</div>
      <div class="cast-scroll" id="castContainer">
        <!-- Cast items injected by JS -->
      </div>
    </div>

    <!-- Render Settings Panel -->
    <div class="panel">
      
      <!-- Resolution -->
      <div class="setting-group">
        <div class="setting-header">
          <span class="setting-label">Mode</span>
        </div>
        <div class="segmented-control" id="resControl">
          <div class="segment active" data-val="720p">720p</div>
          <div class="segment" data-val="1080p">1080p <span class="vip-tag">VIP</span></div>
          <div class="segment" data-val="4K">4K <span class="vip-tag">VIP</span></div>
        </div>
      </div>

      <!-- Length -->
      <div class="setting-group">
        <div class="setting-header">
          <span class="setting-label">Length</span>
          <span class="setting-value-display" id="lengthDisplay">5s</span>
        </div>
        <div class="slider-container">
          <input type="range" id="lengthSlider" min="3" max="15" value="5">
        </div>
        <div class="slider-labels">
          <span>3s</span>
          <span>15s</span>
        </div>
      </div>

      <!-- Video Ratio -->
      <div class="setting-group">
        <div class="setting-header">
          <span class="setting-label">Video Ratio</span>
        </div>
        <div class="segmented-control" id="ratioControl">
          <div class="segment ratio-segment" data-val="16:9">
            <div class="ratio-icon ratio-16-9"></div>
            <span>16:9</span>
          </div>
          <div class="segment ratio-segment" data-val="1:1">
            <div class="ratio-icon ratio-1-1"></div>
            <span>1:1</span>
          </div>
          <div class="segment ratio-segment active" data-val="9:16">
            <div class="ratio-icon ratio-9-16"></div>
            <span>9:16</span>
          </div>
        </div>
      </div>

      <!-- Number of Outputs -->
      <div class="setting-group">
        <div class="setting-header">
          <span class="setting-label">Number of Outputs</span>
        </div>
        <div class="segmented-control" id="outputsControl">
          <div class="segment" data-val="1">1</div>
          <div class="segment" data-val="2">2 <span class="vip-tag">VIP</span></div>
          <div class="segment active" data-val="3">3 <span class="vip-tag">VIP</span></div>
          <div class="segment" data-val="4">4 <span class="vip-tag">VIP</span></div>
        </div>
      </div>

    </div>

    <!-- Summary & Action -->
    <div>
      <div class="summary-chip" id="summaryChip">
        <span class="summary-icon">⬡</span>
        <span id="summaryText">720p • 5s • 9:16 • 3</span>
        <span>•</span>
        <span id="actorCountText">1 Actor</span>
      </div>
    </div>

    <button class="generate-btn" id="generateBtn">
      Generate Scene
    </button>

  </div>

  <script>
    // App State
    const state = {
      resolution: '720p',
      length: 5,
      ratio: '9:16',
      outputs: '3',
      selectedActors: ['Kaelen']
    };

    const actors = [
      { id: 'Kaelen', initials: 'K', color: '#ffaa00' },
      { id: 'Vesper', initials: 'V', color: '#00e1ff' },
      { id: 'Soren',  initials: 'S', color: '#e100ff' },
      { id: 'Nyx',    initials: 'N', color: '#00ff88' },
      { id: 'Rook',   initials: 'R', color: '#ff3366' }
    ];

    const AudioEngine = (function() {
      let ctx = null;

      function initContext() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
      }

      // Play a deep marble 'clink' or 'pop' for buttons/toggles
      function playClink() {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sine';
        // Quick pitch drop for a physical 'pop' sound
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.05);
        
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      }

      // Play a clicking/ratchet sound for sliders
      function playRatchet() {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.02);
      }

      // Heavy power-up sound for Generate
      function playPowerUp() {
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sawtooth';
        // Sweep up from low bass to mid
        osc.frequency.setValueAtTime(50, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.4);
        
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        
        // Add a lowpass filter for a deeper cinematic feel
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(200, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(2000, ctx.currentTime + 0.4);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      }

      return { initContext, playClink, playRatchet, playPowerUp };
    })();

    // Ensure audio context starts on first interaction anywhere
    document.body.addEventListener('pointerdown', AudioEngine.initContext, { once: true });

    function updateSummary() {
      document.getElementById('summaryText').textContent = 
        `${state.resolution} • ${state.length}s • ${state.ratio} • ${state.outputs}`;
      
      const count = state.selectedActors.length;
      document.getElementById('actorCountText').textContent = 
        `${count} ${count === 1 ? 'Actor' : 'Actors'}`;
    }

    function renderCast() {
      const container = document.getElementById('castContainer');
      container.innerHTML = '';
      
      actors.forEach(actor => {
        const div = document.createElement('div');
        div.className = `cast-member ${state.selectedActors.includes(actor.id) ? 'selected' : ''}`;
        div.innerHTML = `
          <div class="cast-avatar" style="--accent-amber: ${actor.color}">${actor.initials}</div>
          <div class="cast-name">${actor.id}</div>
        `;
        div.onclick = () => {
          AudioEngine.playClink();
          const idx = state.selectedActors.indexOf(actor.id);
          if (idx > -1) {
            // Don't deselect if it's the last one
            if (state.selectedActors.length > 1) {
              state.selectedActors.splice(idx, 1);
              div.classList.remove('selected');
            }
          } else {
            state.selectedActors.push(actor.id);
            div.classList.add('selected');
          }
          updateSummary();
        };
        container.appendChild(div);
      });
    }

    function setupSegmentedControl(containerId, stateKey) {
      const container = document.getElementById(containerId);
      const segments = container.querySelectorAll('.segment');
      
      segments.forEach(seg => {
        seg.onclick = () => {
          if(state[stateKey] === seg.dataset.val) return; // already active
          AudioEngine.playClink();
          
          segments.forEach(s => s.classList.remove('active'));
          seg.classList.add('active');
          state[stateKey] = seg.dataset.val;
          updateSummary();
        };
      });
    }

    function setupSlider() {
      const slider = document.getElementById('lengthSlider');
      const display = document.getElementById('lengthDisplay');
      let lastVal = slider.value;

      slider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        if (val !== lastVal) {
          AudioEngine.playRatchet();
          lastVal = val;
          state.length = val;
          display.textContent = `${val}s`;
          updateSummary();
        }
      });
    }

    // Initialize
    renderCast();
    setupSegmentedControl('resControl', 'resolution');
    setupSegmentedControl('ratioControl', 'ratio');
    setupSegmentedControl('outputsControl', 'outputs');
    setupSlider();
    updateSummary();

    // Generate Button Action
    document.getElementById('generateBtn').onclick = () => {
      AudioEngine.playPowerUp();
      const btn = document.getElementById('generateBtn');
      const originalText = btn.innerText;
      btn.innerText = "INITIALIZING RENDER...";
      btn.style.pointerEvents = "none";
      btn.style.filter = "brightness(1.5)";
      
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.pointerEvents = "auto";
        btn.style.filter = "none";
      }, 1500);
    };

  </script>
</body>
</html>
